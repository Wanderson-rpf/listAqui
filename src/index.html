<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ListAqui</title>
    <base href="/" />

    <!-- viewport-fit=cover permite usar a area do notch; user-scalable=no evita
         zoom acidental ao tocar rapido nos itens dentro do mercado. -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Lista de compras com controle de gastos e historico de precos." />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />

    <!-- Faz o app abrir em tela cheia quando instalado no iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ListAqui" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
